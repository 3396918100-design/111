<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管道管径计算器</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
        body{background:#f7f9fc;padding:30px;max-width:620px;margin:0 auto;}
        .container{background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 10px #00000015;}
        h2{text-align:center;color:#224b94;margin-bottom:24px;}
        .input-item{margin-bottom:16px;}
        label{display:block;margin-bottom:6px;color:#333;font-weight:500;}
        input{width:100%;padding:10px 12px;border:1px solid #ccd6e0;border-radius:6px;font-size:16px;}
        button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;font-size:17px;cursor:pointer;margin-top:8px;}
        button:hover{background:#1d4fc4;}
        #result{margin-top:20px;padding:16px;background:#f0f6ff;border-radius:8px;line-height:1.8;font-size:15px;}
    </style>
</head>
<body>
    <div class="container">
        <h2>化工原理｜管道管径选择计算器</h2>
        <div class="input-item">
            <label>质量流量 qₘ (kg/h)</label>
            <input id="qm" placeholder="例题输入：9000" value="9000">
        </div>
        <div class="input-item">
            <label>流体密度 ρ (kg/m³)</label>
            <input id="rho" placeholder="例题输入：810" value="810">
        </div>
        <div class="input-item">
            <label>初选流速 u₀ (m/s)</label>
            <input id="u0" placeholder="例题输入：1.8" value="1.8">
        </div>
        <button onclick="calculate()">开始计算管径</button>
        <div id="result"></div>
    </div>

<script>
function calculate(){
    const qm = parseFloat(document.getElementById("qm").value);
    const rho = parseFloat(document.getElementById("rho").value);
    const u0 = parseFloat(document.getElementById("u0").value);
    //体积流量
    const Vs = qm/(3600*rho);
    //理论计算内径
    const d_calc = Math.sqrt(4*Vs/(Math.PI*u0));
    //选定钢管φ57×3，内径0.051m
    const d_pipe = 0.051;
    //校核实际流速
    const u_real = 4*Vs/(Math.PI * d_pipe * d_pipe);
    const isOK = (u_real >=1 && u_real <=3);

    let html = `
<b>📌计算结果</b><br>
体积流量 Vₛ = ${Vs.toExponential(3)} m³/s<br>
理论计算内径 d = ${(d_calc*1000).toFixed(1)} mm<br>
推荐无缝钢管：φ57 mm × 3 mm<br>
管子实际内径：51 mm（0.051 m）<br>
校核实际流速 u = ${u_real.toFixed(2)} m/s<br>
液体推荐流速区间：1~3 m/s<br>
结论：${isOK ? '<span style="color:green">✅流速在合理范围，管径选择合格</span>' : '<span style="color:red">⚠️流速超出推荐区间，重新选管</span>'}
`;
    document.getElementById("result").innerHTML = html;
}
</script>
</body>
</html>
